# Browser recorder (web/record.html) on Windows: unit tests, then a full recording in real
# Google Chrome and Microsoft Edge (fake camera/mic) against the Firebase emulators.
# Nothing here touches production or deploys anything.
name: Web recorder (Windows)

on:
  push:
    branches: [main, feat/web-recorder]
    paths: ["web/**", "firebase/**", "firebase.json", "organization.example.json", "scripts/configure-organization.py", "scripts/fetch-web-model.py", "Tests/CrossClient/**", ".github/workflows/web-recorder.yml"]
  pull_request:
    paths: ["web/**", "firebase/**", "firebase.json", "organization.example.json", "scripts/configure-organization.py", "scripts/fetch-web-model.py", "Tests/CrossClient/**", ".github/workflows/web-recorder.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        working-directory: firebase/tests
        run: npm ci
      - name: Install Firebase CLI and ffmpeg
        run: |
          npm install -g firebase-tools@15.30.2
          choco install ffmpeg --no-progress -y
      - name: Fetch pinned camera blur model
        run: python scripts/fetch-web-model.py
      - name: Unit tests (core port vs Mac fixtures, fMP4)
        working-directory: firebase/tests
        run: npm run unit
      - name: Browser versions
        shell: pwsh
        run: |
          (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe").VersionInfo.ProductVersion
          (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
      - name: Record in ${{ matrix.browser }} against the emulators
        working-directory: firebase/tests
        env:
          REEL_BROWSER: ${{ matrix.browser }}
          REEL_SMOKE_OUT: ${{ runner.temp }}/reel-smoke
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          npm run recorder-smoke
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-smoke-${{ matrix.browser }}
          path: ${{ runner.temp }}/reel-smoke
          if-no-files-found: ignore
