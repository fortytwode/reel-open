name: Reel checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-windows-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm --prefix firebase/tests ci
      - run: npm --prefix firebase/tests run unit
      - run: npm --prefix desktop-windows test
      - run: npm exec --prefix firebase/tests -- playwright install --with-deps chromium
      - name: Verify browser organization isolation
        run: node --test firebase/tests/browser-organization-state.test.mjs
      - run: npm --prefix browser-extension test
      - run: npm install -g firebase-tools@15.30.2
      - name: Test rendered rules against Firebase emulators
        run: npm --prefix firebase/tests test

  python-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: delivery-service/requirements.txt
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r delivery-service/requirements.txt
      - run: python -m pip install pytest==8.4.2
      - run: python -m pip check
      - run: python -m pytest Tests/test_organization_configuration.py test_organization.py
      - run: PYTHONPATH=. python -m pytest delivery-service
      - run: PYTHONPATH=. python -m pytest meeting-service
      - run: python -m unittest discover -s tests
        working-directory: meeting-bot

  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test
