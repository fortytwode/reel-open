name: Windows companion package

on:
  pull_request:
    paths: ['desktop-windows/**', '.github/workflows/windows-package.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse reminder helper with Windows PowerShell 5.1
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $parserCommand = @'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('desktop-windows/src/windows-reminder-tasks.ps1', [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) { [Console]::Error.WriteLine($parseError.Message) }
            exit 1
          }
          '@
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -Command $parserCommand
          if ($LASTEXITCODE -ne 0) { throw 'The reminder helper failed Windows PowerShell 5.1 parsing.' }
          $helperPath = (Resolve-Path 'desktop-windows/src/windows-reminder-tasks.ps1').Path
          $diagnosticsPath = [IO.Path]::Combine($env:RUNNER_TEMP, 'reminder-config-preflight.log')
          function Invoke-ReminderConfigValidation([string]$configPath, [bool]$expectedSuccess) {
            $arguments = @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', ('"' + $helperPath + '"'),
              '-ValidateLaunchConfig', '-LaunchConfigPath', ('"' + $configPath + '"'), '-Diagnostic')
            $process = Start-Process -FilePath $windowsPowerShell -ArgumentList $arguments -Wait -PassThru -NoNewWindow
            if ($expectedSuccess -and $process.ExitCode -ne 0) { throw "Windows PowerShell 5.1 rejected reminder config $configPath." }
            if (-not $expectedSuccess -and $process.ExitCode -eq 0) { throw "Windows PowerShell 5.1 accepted invalid reminder config $configPath." }
          }
          function Encode-LaunchValue([string]$value) { [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($value)) }
          $portableExe = Encode-LaunchValue 'C:\Program Files\Reel.exe'
          $probeArgument = Encode-LaunchValue '--probe'
          $diagnostics = Encode-LaunchValue $diagnosticsPath
          $configs = @(
            @{ name='portable-production'; text="version=2`nmode=portable`nexecutableB64=$portableExe`nargumentCount=0`n" },
            @{ name='portable-diagnostic'; text="version=2`nmode=portable`nexecutableB64=$portableExe`nargumentCount=1`nargument.0=$probeArgument`nwaitForChildExit=true`ndiagnosticsFileB64=$diagnostics`n" },
            @{ name='msix-production'; text="version=2`nmode=msix`n" },
            @{ name='msix-diagnostic'; text="version=2`nmode=msix`ndiagnosticsFileB64=$diagnostics`n" }
          )
          foreach ($config in $configs) {
            $configPath = [IO.Path]::Combine($env:RUNNER_TEMP, ($config.name + '.conf'))
            [IO.File]::WriteAllText($configPath, $config.text, [Text.UTF8Encoding]::new($false))
            Invoke-ReminderConfigValidation $configPath $true
          }
          $invalidConfigs = @(
            @{ name='duplicate-key'; text="version=2`nmode=msix`nmode=portable`n" },
            @{ name='unknown-key'; text="version=2`nmode=msix`ncommand=whoami`n" },
            @{ name='invalid-base64'; text="version=2`nmode=portable`nexecutableB64=%%%`nargumentCount=0`n" }
          )
          foreach ($config in $invalidConfigs) {
            $configPath = [IO.Path]::Combine($env:RUNNER_TEMP, ('invalid-' + $config.name + '.conf'))
            [IO.File]::WriteAllText($configPath, $config.text, [Text.UTF8Encoding]::new($false))
            Invoke-ReminderConfigValidation $configPath $false
          }
      - name: Install pinned local Whisper browser runtime
        run: npm ci --ignore-scripts --prefix desktop-windows
      - run: npm --prefix desktop-windows test
      - name: Install pinned Electron and test driver
        run: |
          npm ci --prefix desktop-windows/probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop-windows/probe/node_modules/electron/install.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix firebase/tests
      - name: Install media verifier for packaged capture smoke
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Verify AAC encoding, decoding and PCM samples
        shell: pwsh
        run: |
          $electron = Resolve-Path desktop-windows/probe/node_modules/electron/dist/electron.exe
          $probe = Resolve-Path desktop-windows/probe/processing-runtime.mjs
          $process = Start-Process -FilePath $electron -ArgumentList ('"' + $probe + '"') -Wait -PassThru -NoNewWindow
          if ($process.ExitCode) { throw "Audio codec test exited with $($process.ExitCode)" }
      - name: Build package and run the local MP4 trim/export smoke on this architecture
        shell: pwsh
        env:
          REEL_ARCH: ${{ matrix.arch }}
        run: |
          python scripts/configure-organization.py organization.example.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $org = Get-Content desktop-windows/organization.json -Raw | ConvertFrom-Json
          if ($org.projectID -ne 'demo-reel') { throw 'Expected the demo organization.' }
          $credentials = Join-Path $env:RUNNER_TEMP demo-installed.json
          @{ installed = @{ client_id = $org.googleDesktopClientId; client_secret = 'demo-installed-client' } } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM $credentials
          $zip = Join-Path $env:RUNNER_TEMP demo.zip
          $version = (Get-Content -Raw desktop-windows/package.json | ConvertFrom-Json).version
          ./desktop-windows/build-portable.ps1 -ElectronDist desktop-windows/probe/node_modules/electron/dist -ExpectedArchitecture $env:REEL_ARCH -GoogleDesktopClientId $org.googleDesktopClientId -GoogleDesktopCredentialsFile $credentials -Version "$version-ci" -OutputZip $zip
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/demo-package"
      - name: Prepare an unmodified synthetic manual-capture QA kit
        shell: pwsh
        env:
          REEL_ARCH: ${{ matrix.arch }}
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'manual-capture-qa-kit'
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          $packageName = "Reel-Windows-$env:REEL_ARCH.zip"
          $packagePath = Join-Path $kit $packageName
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'demo.zip') -Destination $packagePath
          Copy-Item -LiteralPath 'desktop-windows/probe/fixture.html' -Destination $kit
          $manifest = [ordered]@{
            schemaVersion = 1
            purpose = 'Manual window capture smoke with synthetic screen pixels and a 440 Hz audio tone.'
            sourceCommit = '${{ github.sha }}'
            architecture = $env:REEL_ARCH
            package = @{ file = $packageName; sha256 = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant() }
            fixture = @{ file = 'fixture.html'; screen = 'magenta/green checkerboard'; toneHz = 440; microphone = $false; meetingProvider = $false }
            packageConfiguration = 'CI demo OAuth placeholder only. No organization credential file is included; replace desktop-windows/config.json locally with the authorized installed credentials before sign-in.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $kit 'manifest.json') -Encoding utf8NoBOM
      - name: Upload the synthetic manual-capture QA kit
        uses: actions/upload-artifact@v4
        with:
          name: manual-capture-qa-kit-${{ matrix.arch }}
          path: ${{ runner.temp }}/manual-capture-qa-kit
          if-no-files-found: error
          retention-days: 7
      - name: Snapshot runner and verify reminders before model inference
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $processes = foreach ($name in @('electron','reel','node','powershell','pwsh')) {
            $procSet = @(Get-Process -Name $name -ErrorAction SilentlyContinue)
            $workingSet = 0; $cpuSeconds = 0
            foreach ($proc in $procSet) { $workingSet += $proc.WorkingSet64; if ($null -ne $proc.CPU) { $cpuSeconds += $proc.CPU } }
            [pscustomobject]@{ name=$name; count=$procSet.Count; workingSetMB=[math]::Round($workingSet / 1MB); cpuSeconds=[math]::Round($cpuSeconds) }
          }
          $cpu = (Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'" -ErrorAction SilentlyContinue).PercentProcessorTime
          $memory = [math]::Round($os.FreePhysicalMemory / 1KB)
          Write-Host ("Sanitized runner resources before reminder smoke: " + (@{freePhysicalMemoryMB=$memory;cpuPercent=$cpu;processes=$processes} | ConvertTo-Json -Compress -Depth 3))
          $env:REEL_REMINDER_SMOKE_ELECTRON = (Resolve-Path 'desktop-windows/probe/node_modules/electron/dist/electron.exe').Path
          node desktop-windows/tests/windows-reminder-task.smoke.mjs portable
      - name: Preflight extracted local Whisper assets
        shell: pwsh
        run: |
          $appRoot = Resolve-Path "$env:RUNNER_TEMP/demo-package/resources/app"
          node desktop-windows/tests/local-ai-package-preflight.mjs "$appRoot"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $smoke = Join-Path $appRoot 'desktop-windows/local-ai/smoke.mjs'
          $helper = Join-Path $appRoot 'desktop-windows/src/smoke-timeout.mjs'
          New-Item -ItemType Directory -Force -Path (Split-Path $smoke),(Split-Path $helper) | Out-Null
          Copy-Item -LiteralPath 'desktop-windows/local-ai/smoke.mjs' -Destination $smoke
          Copy-Item -LiteralPath 'desktop-windows/src/smoke-timeout.mjs' -Destination $helper
          node desktop-windows/tests/local-ai-smoke-package-preflight.mjs "$appRoot"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Generate and validate canonical synthetic Whisper speech
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $source = Join-Path $env:RUNNER_TEMP whisper-smoke-source.wav
          $canonical = Join-Path $env:RUNNER_TEMP whisper-smoke-canonical.wav
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $format = [System.Speech.AudioFormat.SpeechAudioFormatInfo]::new(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $synth.SetOutputToWaveFile($source, $format)
          $synth.Speak('This local meeting verifies privacy using on-device transcription.')
          $synth.Dispose()
          node desktop-windows/tests/whisper-fixture.mjs $source $canonical
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify packaged smoke startup before model download
        shell: pwsh
        env:
          REEL_ARCH: ${{ matrix.arch }}
        run: |
          $appRoot = Resolve-Path "$env:RUNNER_TEMP/demo-package/resources/app"
          $electron = Resolve-Path "$env:RUNNER_TEMP/demo-package/Reel.exe"
          $packagePath = Join-Path $appRoot 'package.json'
          $originalPackage = [IO.File]::ReadAllText($packagePath)
          $log = Join-Path $env:RUNNER_TEMP "electron-readiness-$env:REEL_ARCH.log"
          try {
            $package = $originalPackage | ConvertFrom-Json
            $package.main = 'desktop-windows/local-ai/smoke.mjs'
            $utf8 = New-Object Text.UTF8Encoding($false)
            [IO.File]::WriteAllText($packagePath, ($package | ConvertTo-Json), $utf8)
            $env:REEL_WHISPER_SMOKE_LOG = $log
            $env:REEL_WHISPER_SMOKE_ROOT = $appRoot
            $env:REEL_WHISPER_SMOKE_ARCH = $env:REEL_ARCH
            $env:REEL_WHISPER_SMOKE_STARTUP_ONLY = '1'
            $process = Start-Process -FilePath $electron -PassThru -NoNewWindow
            if (-not $process.WaitForExit(60 * 1000)) {
              if (-not $process.HasExited) { $process.Kill($true) }
              throw 'Packaged local Whisper smoke did not start and verify the renderer task handoff within 60 seconds, before model download.'
            }
            $process.Refresh()
            if (Test-Path $log) { Get-Content -LiteralPath $log }
            if ($process.ExitCode) { throw "Packaged smoke startup preflight exited with $($process.ExitCode)" }
            foreach ($phase in @('smoke_start','electron_ready','preload_bridge_present','renderer_script_started','renderer_script_ready','worker_script_ready','renderer_probe_received','renderer_recreation_probe_passed','renderer_model_pin_probe_passed','smoke_startup_preflight_passed')) {
              if (-not (Select-String -LiteralPath $log -Pattern ('"phase":"' + $phase + '"') -Quiet)) {
                throw "Packaged smoke startup preflight exited without $phase diagnostic."
              }
            }
          } finally {
            if (Test-Path $log) { Get-Content -LiteralPath $log }
            [IO.File]::WriteAllText($packagePath, $originalPackage, (New-Object Text.UTF8Encoding($false)))
            Remove-Item Env:REEL_WHISPER_SMOKE_LOG,Env:REEL_WHISPER_SMOKE_ROOT,Env:REEL_WHISPER_SMOKE_ARCH,Env:REEL_WHISPER_SMOKE_STARTUP_ONLY -ErrorAction SilentlyContinue
          }
      - name: Upload packaged smoke startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-whisper-startup-${{ matrix.arch }}-diagnostics
          path: ${{ runner.temp }}/electron-readiness-${{ matrix.arch }}.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify packaged local Whisper inference and offline cache
        shell: pwsh
        env:
          REEL_ARCH: ${{ matrix.arch }}
        run: |
          $freeBytes = (Get-PSDrive -Name C).Free
          if ($freeBytes -lt 4GB) { throw "Local Whisper smoke needs 4 GiB free for its pinned 1.1 GB model/cache; found $([math]::Round($freeBytes / 1GB, 2)) GiB." }
          $audio = Join-Path $env:RUNNER_TEMP whisper-smoke-canonical.wav
          $log = Join-Path $env:RUNNER_TEMP "whisper-smoke-$env:REEL_ARCH.log"
          $electron = Resolve-Path "$env:RUNNER_TEMP/demo-package/Reel.exe"
          $appRoot = Resolve-Path "$env:RUNNER_TEMP/demo-package/resources/app"
          $packagePath = Join-Path $appRoot 'package.json'
          $originalPackage = [IO.File]::ReadAllText($packagePath)
          $smoke = Join-Path $appRoot 'desktop-windows/local-ai/smoke.mjs'
          $helper = Join-Path $appRoot 'desktop-windows/src/smoke-timeout.mjs'
          try {
            $package = $originalPackage | ConvertFrom-Json
            $package.main = 'desktop-windows/local-ai/smoke.mjs'
            $utf8 = New-Object Text.UTF8Encoding($false)
            [IO.File]::WriteAllText($packagePath, ($package | ConvertTo-Json), $utf8)
            $env:REEL_WHISPER_SMOKE_AUDIO = $audio
            $env:REEL_WHISPER_SMOKE_ROOT = $appRoot
            $env:REEL_WHISPER_SMOKE_ARCH = $env:REEL_ARCH
            $env:REEL_WHISPER_SMOKE_LOG = $log
            $process = Start-Process -FilePath $electron -PassThru -NoNewWindow
            if (-not $process.WaitForExit(65 * 60 * 1000)) {
              if (-not $process.HasExited) { $process.Kill($true) }
              throw 'Packaged local Whisper process exceeded its 65 minute outer bound.'
            }
            if (Test-Path $log) { Get-Content -LiteralPath $log }
            $process.Refresh()
            if ($process.ExitCode) { throw "Packaged local Whisper inference/offline cache smoke exited with $($process.ExitCode)" }
          } finally {
            [IO.File]::WriteAllText($packagePath, $originalPackage, (New-Object Text.UTF8Encoding($false)))
            Remove-Item -LiteralPath $smoke,$helper -Force -ErrorAction SilentlyContinue
            Remove-Item Env:REEL_WHISPER_SMOKE_AUDIO,Env:REEL_WHISPER_SMOKE_ROOT,Env:REEL_WHISPER_SMOKE_ARCH,Env:REEL_WHISPER_SMOKE_LOG -ErrorAction SilentlyContinue
          }
      - name: Print packaged local Whisper diagnostics
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "whisper-smoke-${{ matrix.arch }}.log"
          if (Test-Path $log) { Get-Content -LiteralPath $log }
      - name: Upload packaged local Whisper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-whisper-${{ matrix.arch }}-diagnostics
          path: ${{ runner.temp }}/whisper-smoke-${{ matrix.arch }}.log
          if-no-files-found: warn
          retention-days: 7
      - name: Snapshot runner after packaged local Whisper inference
        if: always()
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $processes = foreach ($name in @('electron','reel','node','powershell','pwsh')) {
            $procSet = @(Get-Process -Name $name -ErrorAction SilentlyContinue)
            $workingSet = 0; $cpuSeconds = 0
            foreach ($proc in $procSet) { $workingSet += $proc.WorkingSet64; if ($null -ne $proc.CPU) { $cpuSeconds += $proc.CPU } }
            [pscustomobject]@{ name=$name; count=$procSet.Count; workingSetMB=[math]::Round($workingSet / 1MB); cpuSeconds=[math]::Round($cpuSeconds) }
          }
          $cpu = (Get-CimInstance Win32_PerfFormattedData_PerfOS_Processor -Filter "Name='_Total'" -ErrorAction SilentlyContinue).PercentProcessorTime
          $memory = [math]::Round($os.FreePhysicalMemory / 1KB)
          Write-Host ("Sanitized runner resources after local Whisper: " + (@{freePhysicalMemoryMB=$memory;cpuPercent=$cpu;processes=$processes} | ConvertTo-Json -Compress -Depth 3))
          $caches = @(Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'reel-whisper-cache-*' -ErrorAction SilentlyContinue)
          Write-Host ("Sanitized Whisper cache directories remaining: $($caches.Count)")
          foreach ($cache in $caches) { Remove-Item -LiteralPath $cache.FullName -Recurse -Force }
      - name: Launch the extracted app and verify first-run setup
        working-directory: firebase/tests
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { _electron as electron } from 'playwright';
          const app = await electron.launch({executablePath: path.join(process.env.RUNNER_TEMP, 'demo-package', 'Reel.exe')});
          try {
            const window = await app.firstWindow();
            await window.getByRole('button', {name: 'Sign in with Google'}).waitFor();
            const state = await window.evaluate(() => window.reelDesktop.state());
            assert.equal(state.configured, true);
            assert.equal(state.profile, null);
            assert.deepEqual(state.startup, {mode:'portable',enabled:false});
            const setStartup = enabled => window.evaluate(enabled => window.reelDesktop.action('setCompanionStartup', {enabled}), enabled);
            try {
              assert.deepEqual((await setStartup(true)).startup, {mode:'portable',enabled:true});
              assert.deepEqual((await window.evaluate(() => window.reelDesktop.state())).startup, {mode:'portable',enabled:true});
            } finally {
              assert.deepEqual((await setStartup(false)).startup, {mode:'portable',enabled:false});
            }
          } finally {
            await app.close();
          }
          JS
      - name: Verify packaged Recorder and Notetaker app entries
        shell: pwsh
        run: node desktop-windows/tests/product-entry-smoke.mjs "$env:RUNNER_TEMP/demo-package"
      - name: Prepare production manual-capture harness in extracted package
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'demo-package/resources/app'
          $probe = Join-Path $app 'desktop-windows/probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Copy-Item desktop-windows/probe/adapter-main.mjs, desktop-windows/probe/fixture.html -Destination $probe
          $manifestPath = Join-Path $app 'package.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.main = 'desktop-windows/probe/adapter-main.mjs'
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 8), $utf8)
      - name: Test the packaged Recorder against the available Windows audio hardware
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'manual-capture-smoke'
          $executable = Join-Path $env:RUNNER_TEMP 'demo-package/Reel.exe'
          $sessionId = (Get-Process -Id $PID).SessionId
          $soundDeviceCount = @(Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue).Count
          Write-Host "Windows session ID=$sessionId; sound device count=$soundDeviceCount"
          $process = Start-Process -FilePath $executable -ArgumentList @('--manual-picker', '--test-missing-output', "--out=$out") -Wait -PassThru -NoNewWindow
          if ($process.ExitCode) { throw "Packaged manual capture smoke exited with $($process.ExitCode)" }
          node desktop-windows/probe/adapter-verify.mjs --manual-picker --test-missing-output "--out=$out"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
